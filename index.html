<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tulip Heart Garden</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="garden">
    <div class="title">
      <h1>🌷 A Little Garden of Love 🌷</h1>
      <p>Tap a tulip...</p>
    </div>

    <div class="tulip-field">
      <button class="tulip tulip-1" aria-label="Tulip">
        <span class="flower">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="petal p5"></span>
        </span>
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
      </button>

      <button class="tulip tulip-2" aria-label="Tulip">
        <span class="flower">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="petal p5"></span>
        </span>
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
      </button>

      <button class="tulip tulip-3" aria-label="Tulip">
        <span class="flower">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="petal p5"></span>
        </span>
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
      </button>

      <button class="tulip tulip-4" aria-label="Tulip">
        <span class="flower">
          <span class="petal p1"></span>
          <span class="petal p2"></span>
          <span class="petal p3"></span>
          <span class="petal p4"></span>
          <span class="petal p5"></span>
        </span>
        <span class="stem"></span>
        <span class="leaf leaf-left"></span>
        <span class="leaf leaf-right"></span>
      </button>
    </div>
  </div>

  <div id="effects"></div>

  <script src="script.js"></script>
</body>
</html>
